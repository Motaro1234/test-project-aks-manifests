# ==========================================================================
# pv-pvc-sharecenter2.yaml
#
# วางไฟล์นี้ใน manifests repo (path ที่ ArgoCD Application ชี้อยู่)
# ระดับเดียวกับ Deployment/Service ของเว็บแอป
#
# NFS ไม่ต้องใช้ Secret/key — auth ด้วย private endpoint + allowed subnet
# ที่ตั้งไว้บน Azure แล้ว
# ==========================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sharecenter2-nfs-pv
spec:
  capacity:
    storage: 32Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - rsize=1048576
    - wsize=1048576
    - hard
    - timeo=600
  nfs:
    server: fs-vlqfgngfx1tng3xtv.z49.file.storage.azure.net
    path: /sharecenter2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sharecenter2-nfs-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 32Gi
  volumeName: sharecenter2-nfs-pv